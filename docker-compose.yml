version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: umbrabet-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-umbrabet}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - umbrabet-network

  redis:
    image: redis:7-alpine
    container_name: umbrabet-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - umbrabet-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: umbrabet-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-umbrabet}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
    networks:
      - umbrabet-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: umbrabet-web
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    networks:
      - umbrabet-network

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: umbrabet-admin
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3002:3002"
    volumes:
      - ./apps/admin:/app/apps/admin
      - /app/apps/admin/node_modules
      - /app/apps/admin/.next
    networks:
      - umbrabet-network

volumes:
  postgres_data:
  redis_data:

networks:
  umbrabet-network:
    driver: bridge
